name: ebay-sniper

services:
  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:?GIT_SHA is required}
    image: ebay-sniper-server:${GIT_SHA:?GIT_SHA is required}
    restart: unless-stopped
    stop_grace_period: 10s
    env_file: /opt/ebay-sniper/.env
    environment:
      PORT: "3000"
      TZ: UTC
    # No depends_on: the deletion endpoint must answer while Postgres is down (A4).
    ports:
      - "127.0.0.1:3140:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: ebay_sniper
      POSTGRES_DB: ebay_sniper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    # shared_buffers stays at the default (ADR 0012).
    command: ["postgres", "-c", "max_connections=30"]
    volumes:
      # Postgres 18 images keep PGDATA at /var/lib/postgresql/18/docker, inside this mount.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during first-start initialisation the server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ebay_sniper -d ebay_sniper"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # No ports: Postgres is reachable only on the Compose network (A8).

  # One-off migration run: `docker compose run --rm migrate`. The profile keeps `up` from starting it.
  migrate:
    image: ebay-sniper-server:${GIT_SHA:?GIT_SHA is required}
    profiles: ["migrate"]
    depends_on:
      # The deploy passes --no-deps and brings Postgres up in its own step.
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ebay_sniper:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/ebay_sniper
      TZ: UTC
    working_dir: /app/apps/ops
    command: ["node", "dist/main.js", "migrate"]
    healthcheck:
      # The image's HEALTHCHECK is for the server.
      disable: true
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
    # A fixed name, so the data survives container recreation and `down` (A12).
    name: ebay-sniper-pgdata
