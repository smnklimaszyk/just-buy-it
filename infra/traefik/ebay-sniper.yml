# Traefik route for the eBay deal monitor (repo: ebay-sniper, compose project: ebay-sniper)
# Container: ebay-sniper-server-1, published on 127.0.0.1:3140
# The rate limit is far above eBay's own traffic (at most about 1,500 deletion notifications a day),
# so retries from eBay are never refused; it only stops floods. The app refuses bodies over 64 KB.

http:
  routers:
    ebay-sniper-http:
      rule: "Host(`deals.intra-ai.de`)"
      entryPoints:
        - web
      service: ebay-sniper
      middlewares:
        - redirect-to-https

    ebay-sniper-https:
      rule: "Host(`deals.intra-ai.de`)"
      entryPoints:
        - websecure
      service: ebay-sniper
      tls:
        certResolver: le
      middlewares:
        - hsts-headers
        - ebay-sniper-ratelimit

  middlewares:
    ebay-sniper-ratelimit:
      rateLimit:
        average: 10
        period: 1s
        burst: 50

  services:
    ebay-sniper:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:3140"
