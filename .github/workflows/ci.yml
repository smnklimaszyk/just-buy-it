name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # S1b adds a Postgres 18 service here once database code exists.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so turbo --affected can diff against the pull request base.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Affected checks
        if: github.event_name == 'pull_request'
        run: pnpm turbo run lint typecheck test --affected
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Full checks
        if: github.event_name == 'push'
        run: pnpm turbo run lint typecheck test build

      - name: Import rules
        run: pnpm depcruise

      - name: Image build
        if: github.event_name == 'push'
        run: docker build -f infra/Dockerfile .

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
